name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 解压并打印诊断
        run: |
          echo "=== 仓库根目录 ==="
          ls -la
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then echo "::error::仓库根目录没找到 zip"; exit 1; fi
          echo "源码包: $ZIP"
          rm -rf src && mkdir -p src
          unzip -q "$ZIP" -d src || { echo "::error::解压失败，zip 可能损坏或加密"; exit 1; }
          echo "=== 关键文件 ==="
          find src -maxdepth 5 \( -name gradlew -o -name 'gradle-wrapper.properties' -o -name 'settings.gradle*' -o -name local.properties \) -print
          echo "=== wrapper 版本 ==="
          find src -name gradle-wrapper.properties -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;

      - name: 定位项目根目录
        run: |
          F=$(find src \( -name settings.gradle -o -name settings.gradle.kts \) -type f -print -quit)
          if [ -z "$F" ]; then F=$(find src -name gradlew -type f -print -quit); fi
          if [ -z "$F" ]; then
            echo "::error::没找到 settings.gradle / gradlew，可能不是标准 Gradle 工程"
            find src -maxdepth 3 -type d | head -30
            exit 1
          fi
          ROOT=$(dirname "$F")
          echo "项目根目录: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: 修复手机 zip 常见问题
        run: |
          cd "$ROOT"
          if [ -f gradlew ]; then sed -i 's/\r$//' gradlew; chmod +x gradlew; fi
          rm -f local.properties
          if grep -Rqs 'androidx\.' --include='*.gradle' --include='*.gradle.kts' . ; then
            if [ -f gradle.properties ] && ! grep -q 'android.useAndroidX' gradle.properties; then
              printf '\nandroid.useAndroidX=true\n' >> gradle.properties
            fi
          fi
          echo "=== 项目根文件 ==="
          ls -la | head -40

      - name: 构建 Debug APK
        run: |
          cd "$ROOT"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -f gradlew ]; then
            echo "::error::项目缺少 gradlew，请勿改用系统 gradle（版本不兼容 AGP）"
            exit 1
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
